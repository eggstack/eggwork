        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-evidence-aarch64-unknown-linux-gnu"
          path: "./eggpack-inputs/aarch64-unknown-linux-gnu"
      - name: Download qualification "x86_64-apple-darwin"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-evidence-x86_64-apple-darwin"
          path: "./eggpack-inputs/x86_64-apple-darwin"
      - name: Download qualification "x86_64-pc-windows-msvc"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-evidence-x86_64-pc-windows-msvc"
          path: "./eggpack-inputs/x86_64-pc-windows-msvc"
      - name: Download qualification "x86_64-unknown-linux-gnu"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-evidence-x86_64-unknown-linux-gnu"
          path: "./eggpack-inputs/x86_64-unknown-linux-gnu"
      - name: Download consumer evidence "aarch64-apple-darwin"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-aarch64-apple-darwin"
          path: "./eggpack-inputs/aarch64-apple-darwin"
      - name: Download consumer evidence "aarch64-unknown-linux-gnu"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-aarch64-unknown-linux-gnu"
          path: "./eggpack-inputs/aarch64-unknown-linux-gnu"
      - name: Download consumer evidence "x86_64-apple-darwin"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-x86_64-apple-darwin"
          path: "./eggpack-inputs/x86_64-apple-darwin"
      - name: Download consumer evidence "x86_64-pc-windows-msvc"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-x86_64-pc-windows-msvc"
          path: "./eggpack-inputs/x86_64-pc-windows-msvc"
      - name: Download consumer evidence "x86_64-unknown-linux-gnu"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-x86_64-unknown-linux-gnu"
          path: "./eggpack-inputs/x86_64-unknown-linux-gnu"
      - name: Create finalized release directory
        shell: bash
        run: "mkdir -p './eggpack-finalized'"
      - name: Aggregate and finalize release
        shell: bash
        run: "'eggpack' 'ci' '_aggregate' '--contract' 'release/eggpack/distribution.toml' '--release-plan' 'eggpack-runtime/release-plan.json' '--ci-plan' 'eggpack-runtime/release-ci-plan.json' '--inputs-dir' './eggpack-inputs' '--output-root' './eggpack-finalized/root' '--output' './eggpack-finalized/summary.json'"
      - name: Upload internal finalized release
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-finalized-release"
          path: ./eggpack-finalized
          if-no-files-found: error
          retention-days: 7
  stage:
    needs: aggregate
    if: github.event_name == 'workflow_dispatch'
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ inputs.release_tag }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Validate exact-tag source
        shell: bash
        run: "test -n \"${{ inputs.release_tag }}\""
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 30
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 32a0903936fcc283863e0bfb86151b13b4d75ce9 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Download finalized release
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-finalized-release"
          path: ./eggpack-finalized
          if-no-files-found: error
      - name: Prepare staging payload
        shell: bash
        run: "'eggpack' 'ci' '_prepare-stage' '--contract' 'release/eggpack/distribution.toml' '--release-manifest' './eggpack-finalized/release-manifest.json' '--finalized-root' './eggpack-finalized/root' '--github-policy' 'eggpack-runtime/github-draft.json' '--install-policy' 'release/eggpack/install-policy.toml' '--output-dir' './eggpack-staging' '--output-payload' './eggpack-staging-payload.json'"
      - name: Stage GitHub draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "'eggpack' 'ci' '_stage-github-draft' '--payload' './eggpack-staging-payload.json' '--github-policy' 'eggpack-runtime/github-draft.json' '--staging-dir' './eggpack-staging' '--output-receipt' './eggpack-staging-receipt.json'"
      - name: Upload staging receipt
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-staging-receipt"
          path: ./eggpack-staging-receipt.json
          if-no-files-found: error
          retention-days: 7
