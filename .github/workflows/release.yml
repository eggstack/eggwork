name: Eggpack candidate builds
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing tag to stage
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: eggpack-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}"
      - name: Check Cargo availability
        shell: bash
        run: cargo --version
  resolve:
    needs: preflight
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}"
      - name: Validate exact-tag source
        shell: bash
        run: "test -n \"${{ inputs.release_tag }}\""
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 30
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 32a0903936fcc283863e0bfb86151b13b4d75ce9 --locked eggpack-cli
          eggpack --version
      - name: Create runtime identity directory
        shell: bash
        run: "mkdir -p './eggpack-runtime'"
      - name: Resolve runtime release identity
        shell: bash
        run: |
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          'eggpack' 'ci' '_resolve-release' '--contract' 'release/eggpack/distribution.toml' '--pack-config' 'release/eggpack/pack.toml' '--build-bindings' 'release/eggpack/build-bindings.toml' '--qualification-bindings' 'release/eggpack/qualification-bindings.toml' '--consumer-validators' 'release/eggpack/consumer-validators.json' '--selected' 'linux-x64,linux-arm64,macos-x64,macos-arm64,windows-x64' '--tag' '${{ inputs.release_tag }}' '--source-revision' "$head_sha" '--template' 'release/eggpack/github-template.json' '--source-root' '${{ github.workspace }}' '--output-plan' './eggpack-runtime/release-plan.json' '--output-ci-plan' './eggpack-runtime/release-ci-plan.json' '--output-github-policy' './eggpack-runtime/github-draft.json'
      - name: Upload runtime release identity
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
          retention-days: 7
  build_aarch64_apple_darwin:
    needs: resolve
    runs-on: "macos-14"
    permissions:
      contents: read
    timeout-minutes: 90
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c"
        with:
          toolchain: "1.89.0"
          targets: "aarch64-apple-darwin"
      - name: Verify Rust toolchain
        shell: bash
        run: cargo +'1.89.0' --version
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 30
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 32a0903936fcc283863e0bfb86151b13b4d75ce9 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Build "aarch64-apple-darwin / eggworkd"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+1.89.0' 'build' '--release' '--locked' '--target' 'aarch64-apple-darwin' '--package' 'eggwork-server' '--bin' 'eggworkd'"
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'eggpack-runtime/release-plan.json' '--build-bindings' 'release/eggpack/build-bindings.toml' '--target' 'aarch64-apple-darwin' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_aarch64_apple_darwin'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-build-handoff-aarch64-apple-darwin"
          path: "./eggpack-build/build_aarch64_apple_darwin"
          if-no-files-found: error
          retention-days: 7
