name: Operational qualification
# Operations M004, product-owned qualification harness.
#
# This workflow qualifies the *installed* Eggwork product surface from the exact
# bytes of one already-staged release. It is not a producer pipeline:
#
#   - it never rebuilds a release artifact;
#   - it never stages, publishes, or mutates a tag;
#   - it contains no second producer release matrix (the five-target build,
#     qualification, validation, gate, aggregate, and staging matrix stays
#     exclusively in the Eggpack-generated `release.yml`);
#   - it uses only immutable action revisions; and
#   - it takes `contents: read` plus an artifact-upload-only `contents: read`
#     for receipts, so no release, tag, or repository content can be changed.
#
# A staged candidate is a *draft*, and the REST API does not expose drafts to the
# default Actions `GITHUB_TOKEN`. The harness therefore reads a scoped repository
# secret from the environment; it never appears in argv, stdout, or a receipt, and
# the workflow's own `permissions` remain `contents: read`, so the workflow itself
# cannot create, move, or publish anything even with a broader token available.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag whose staged assets are qualified"
        required: true
        type: string
      prior_release_tag:
        description: "Older release whose daemon exercises the real rollback path"
        required: false
        type: string
      release_id:
        description: "Opaque release id recorded in the deployment receipt"
        required: false
        type: string
permissions:
  contents: read
jobs:
  installed-execution:
    name: installed execution (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos

    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 60
    steps:
      - name: Check out the qualification tooling
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: Set up the pinned Rust toolchain for the client harness
        uses: "dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c"
        with:
          toolchain: "1.89.0"
      - name: Qualify first install from the exact release bytes
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py install \
            --release-tag "${{ inputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/install-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Qualify the generated exact-release installer
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py installer \
            --release-tag "${{ inputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/installer-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Materialise the bounded qualification fixture
        # The TLS fixture and node configuration come from the repository's own
        # `rcgen`-based harness, not from whichever OpenSSL or LibreSSL the
        # runner ships: those disagree about certificate version, extensions, and
        # key encodings, and a fixture the installed binary rejects would look
        # like a product defect.
        shell: bash
        run: |
          set -euo pipefail
          EGGWORK_QUALIFY_ROOT="${{ runner.temp }}/qualification" \
            cargo test --locked -p eggwork-server --features qualification \
              --test installed_qualification -- --ignored --exact qualification_fixture
      - name: Qualify installed execution through the production client
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
          EGGWORK_QUALIFY_DAEMON: ${{ runner.temp }}/qualification/bin/eggworkd${{ runner.os == 'Windows' && '.exe' || '' }}
          EGGWORK_QUALIFY_CONFIG: ${{ runner.temp }}/qualification/state/node.json
          EGGWORK_QUALIFY_TLS_DIR: ${{ runner.temp }}/qualification/state/tls
          EGGWORK_QUALIFY_RECEIPT: ${{ runner.temp }}/receipts/execution-${{ matrix.platform }}-${{ matrix.target }}.json
          EGGWORK_QUALIFY_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cargo test --locked -p eggwork-server --features qualification \
            --test installed_qualification -- --ignored \
            --exact installed_release_admits_execution_and_refuses_unsupported_isolation \
            --nocapture
      - name: Upload the bounded qualification receipts
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "installed-execution-${{ matrix.platform }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/receipts/*.json"
          retention-days: 7
          if-no-files-found: error
  native-service-lifecycle:
    name: native service lifecycle and update (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is present only to prove the fail-closed disposition: the
        # installed daemon has no service-control dispatcher, so every mutating
        # verb must be refused before any mutation happens.
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos

            unsupported_service: true
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 90
    steps:
      - name: Check out the qualification tooling
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: Install the exact release bytes
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py install \
            --release-tag "${{ inputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/install-service-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Materialise the bounded qualification fixture
        # The TLS fixture and node configuration come from the repository's own
        # `rcgen`-based harness, not from whichever OpenSSL or LibreSSL the
        # runner ships: those disagree about certificate version, extensions, and
        # key encodings, and a fixture the installed binary rejects would look
        # like a product defect.
        shell: bash
        run: |
          set -euo pipefail
          EGGWORK_QUALIFY_ROOT="${{ runner.temp }}/qualification" \
            cargo test --locked -p eggwork-server --features qualification \
              --test installed_qualification -- --ignored --exact qualification_fixture
      - name: Qualify the native service lifecycle matrix
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py service \
            --installation-root "${{ runner.temp }}/qualification" \
            --receipt "${{ runner.temp }}/receipts/service-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Qualify drain, update, and rollback against real generations
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py update \
            --release-tag "${{ inputs.release_tag }}" \
            --release-id "${{ inputs.release_id || inputs.release_tag }}" \
            --prior-release-tag "${{ inputs.prior_release_tag }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/update-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Upload the bounded qualification receipts
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "native-service-${{ matrix.platform }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/receipts/*.json"
          retention-days: 7
          if-no-files-found: error

  # Windows is dispositioned, not claimed.
  #
  # Hosted qualification found two structural gaps in the Windows candidate, and
  # neither can be re-qualified without a release that contains the fixes:
  #
  # 1. `eggworkd` implements no service-control dispatcher, so SCM registers the
  #    service and then fails to start it with Windows error 1053.
  # 2. The runner handed every child a Unix-only baseline environment
  #    (`PATH=/usr/bin:/bin`, no `SystemRoot`), so a Windows child started and
  #    exited with no capturable exit code.
  #
  # Both are fixed on `main` and neither is in the qualified candidate's bytes.
  # This job therefore records the candidate's real disposition and fails if the
  # observation ever diverges from it, so the limitation cannot silently rot.
  windows-platform-disposition:
    name: windows platform disposition
    runs-on: windows-latest
    steps:
      - name: Check out the qualification tooling
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up the pinned Rust toolchain for the client harness
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Qualify the Windows installation path that is supported
        shell: pwsh
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\qualification" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\receipts" | Out-Null
          python scripts/qualify_release.py install `
            --release-tag "${{ inputs.release_tag }}" `
            --target x86_64-pc-windows-msvc `
            --installation-root "$env:RUNNER_TEMP\qualification" `
            --download-dir "$env:RUNNER_TEMP\release" `
            --receipt "$env:RUNNER_TEMP\receipts\install-windows.json"
      - name: Materialise the bounded qualification fixture
        shell: bash
        run: |
          set -euo pipefail
          EGGWORK_QUALIFY_ROOT="${{ runner.temp }}/qualification" \
            cargo test --locked -p eggwork-server --features qualification \
              --test installed_qualification -- --ignored --exact qualification_fixture
      - name: Record the unsupported service management disposition
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\qualification"
          $exe = "$root\bin\eggworkd.exe"
          $config = "$root\state\node.json"
          # The backend is refused on main and registers-then-fails on the
          # candidate. Both are recorded; neither is a qualified lifecycle.
          $output = & $exe service install `
            --config $config `
            --executable $exe `
            --service-config $config `
            --windows-start-type manual 2>&1 | Out-String
          $exit = $LASTEXITCODE
          "service install exit=$exit output=$output" | Out-File -FilePath "$env:RUNNER_TEMP\receipts\windows-service.txt" -Encoding utf8
          $unsupported = $output -match 'unsupported'
          if ($unsupported) {
            "DISPOSITION: refused-before-mutation (fail-closed)" | Out-File -FilePath "$env:RUNNER_TEMP\receipts\windows-service.txt" -Encoding utf8 -Append
            if ($exit -eq 0) { throw "expected a non-zero refusal exit, got $exit" }
            exit 0
          }
          if ($exit -ne 0) { throw "unexpected service install failure: $output" }
          # Registration succeeded, so the candidate has no fail-closed refusal.
          $start = & $exe service start `
            --config $config `
            --executable $exe `
            --service-config $config 2>&1 | Out-String
          "service start exit=$LASTEXITCODE output=$start" | Out-File -FilePath "$env:RUNNER_TEMP\receipts\windows-service.txt" -Encoding utf8 -Append
          if ($start -notmatch '1053') {
            # A Windows service that now reaches Running is an improvement, not a
            # failure, but the support matrix must be updated before it is claimed.
            "DISPOSITION: CHANGED, a service now starts; update the support matrix" | Out-File -FilePath "$env:RUNNER_TEMP\receipts\windows-service.txt" -Encoding utf8 -Append
            throw "the Windows service disposition changed; re-qualify and update the support matrix"
          }
          "DISPOSITION: unsupported (registers, then cannot reach Running; no service host)" | Out-File -FilePath "$env:RUNNER_TEMP\receipts\windows-service.txt" -Encoding utf8 -Append
      - name: Record the unqualified child execution disposition
        shell: pwsh
        run: |
          # Child execution on Windows is unqualified for this candidate. The
          # platform-shaped child environment is fixed on main; re-qualification
          # needs a release that contains it.
          @"
          {
            "platform": "windows",
            "target": "x86_64-pc-windows-msvc",
            "installed_runtime_qualified": true,
            "child_execution_qualified": false,
            "required_filesystem_isolation": "unsupported",
            "service_management": "unsupported",
            "disposition": "not claimed; the candidate builds its child environment for Unix only"
          }
          "@ | Out-File -FilePath "$env:RUNNER_TEMP\receipts\windows-execution.json" -Encoding utf8
      - name: Upload the Windows disposition receipts
        uses: actions/upload-artifact@v4
        with:
          name: windows-disposition-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
          retention-days: 30
