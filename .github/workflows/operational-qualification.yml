name: Operational qualification
# Operations M004, product-owned qualification harness.
#
# This workflow qualifies the *installed* Eggwork product surface from the exact
# bytes of one already-staged release. It is not a producer pipeline:
#
#   - it never rebuilds a release artifact;
#   - it never stages, publishes, or mutates a tag;
#   - it contains no second producer release matrix (the five-target build,
#     qualification, validation, gate, aggregate, and staging matrix stays
#     exclusively in the Eggpack-generated `release.yml`);
#   - it uses only immutable action revisions; and
#   - it takes `contents: read` plus an artifact-upload-only `contents: read`
#     for receipts, so no release, tag, or repository content can be changed.
#
# A staged candidate is a *draft*, and the REST API does not expose drafts to the
# default Actions `GITHUB_TOKEN`. The harness therefore reads a scoped repository
# secret from the environment; it never appears in argv, stdout, or a receipt, and
# the workflow's own `permissions` remain `contents: read`, so the workflow itself
# cannot create, move, or publish anything even with a broader token available.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag whose staged assets are qualified"
        required: true
        type: string
      prior_release_tag:
        description: "Older release whose daemon exercises the real rollback path"
        required: false
        type: string
      release_id:
        description: "Opaque release id recorded in the deployment receipt"
        required: false
        type: string
permissions:
  contents: read
jobs:
  installed-execution:
    name: installed execution (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos

    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 60
    steps:
      - name: Check out the qualification tooling
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: Set up the pinned Rust toolchain for the client harness
        uses: "dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c"
        with:
          toolchain: "1.89.0"
      - name: Qualify first install from the exact release bytes
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py install \
            --release-tag "${{ inputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/install-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Qualify the generated exact-release installer
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py installer \
            --release-tag "${{ inputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/installer-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Materialise the bounded qualification fixture
        # The TLS fixture and node configuration come from the repository's own
        # `rcgen`-based harness, not from whichever OpenSSL or LibreSSL the
        # runner ships: those disagree about certificate version, extensions, and
        # key encodings, and a fixture the installed binary rejects would look
        # like a product defect.
        shell: bash
        run: |
          set -euo pipefail
          EGGWORK_QUALIFY_ROOT="${{ runner.temp }}/qualification" \
            cargo test --locked -p eggwork-server --features qualification \
              --test installed_qualification -- --ignored --exact qualification_fixture
      - name: Qualify installed execution through the production client
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
          EGGWORK_QUALIFY_DAEMON: ${{ runner.temp }}/qualification/bin/eggworkd${{ runner.os == 'Windows' && '.exe' || '' }}
          EGGWORK_QUALIFY_CONFIG: ${{ runner.temp }}/qualification/state/node.json
          EGGWORK_QUALIFY_TLS_DIR: ${{ runner.temp }}/qualification/state/tls
          EGGWORK_QUALIFY_RECEIPT: ${{ runner.temp }}/receipts/execution-${{ matrix.platform }}-${{ matrix.target }}.json
          EGGWORK_QUALIFY_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cargo test --locked -p eggwork-server --features qualification \
            --test installed_qualification -- --ignored \
            --exact installed_release_admits_execution_and_refuses_unsupported_isolation \
            --nocapture
      - name: Upload the bounded qualification receipts
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "installed-execution-${{ matrix.platform }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/receipts/*.json"
          retention-days: 7
          if-no-files-found: error
  native-service-lifecycle:
    name: native service lifecycle and update (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is present only to prove the fail-closed disposition: the
        # installed daemon has no service-control dispatcher, so every mutating
        # verb must be refused before any mutation happens.
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos

            unsupported_service: true
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 90
    steps:
      - name: Check out the qualification tooling
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: Install the exact release bytes
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py install \
            --release-tag "${{ inputs.release_tag }}" \
            --target "${{ matrix.target }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/install-service-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Materialise the bounded qualification fixture
        # The TLS fixture and node configuration come from the repository's own
        # `rcgen`-based harness, not from whichever OpenSSL or LibreSSL the
        # runner ships: those disagree about certificate version, extensions, and
        # key encodings, and a fixture the installed binary rejects would look
        # like a product defect.
        shell: bash
        run: |
          set -euo pipefail
          EGGWORK_QUALIFY_ROOT="${{ runner.temp }}/qualification" \
            cargo test --locked -p eggwork-server --features qualification \
              --test installed_qualification -- --ignored --exact qualification_fixture
      - name: Qualify the native service lifecycle matrix
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py service \
            --installation-root "${{ runner.temp }}/qualification" \
            --receipt "${{ runner.temp }}/receipts/service-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Qualify drain, update, and rollback against real generations
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/qualify_release.py update \
            --release-tag "${{ inputs.release_tag }}" \
            --release-id "${{ inputs.release_id || inputs.release_tag }}" \
            --prior-release-tag "${{ inputs.prior_release_tag }}" \
            --installation-root "${{ runner.temp }}/qualification" \
            --download-dir "${{ runner.temp }}/release" \
            --receipt "${{ runner.temp }}/receipts/update-${{ matrix.platform }}-${{ matrix.target }}.json"
      - name: Upload the bounded qualification receipts
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "native-service-${{ matrix.platform }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/receipts/*.json"
          retention-days: 7
          if-no-files-found: error

  # Windows is dispositioned, not claimed.
  #
  # Corrected after Foundation M004. The original diagnosis here was wrong, and
  # the comment said so before the cause was found; keeping the correction
  # visible matters more than tidiness.
  #
  # The earlier text blamed the runner's Unix-only baseline environment
  # (`PATH=/usr/bin:/bin`, no `SystemRoot`) for a Windows child exiting with no
  # capturable exit code. That shaping was a real defect and it is fixed, but it
  # was never the blocker: on Windows `LocalProcessRunner::run` refused with
  # `UnsupportedPlatform` *before* creating any child, so no child ever received
  # an environment. The `Failed / Internal / exit_code: null` receipt proved
  # exactly that, which is what the M004 plan's baseline section records.
  #
  # The two genuine gaps in the qualified candidate are:
  #
  # 1. `eggworkd` implements no service-control dispatcher, so SCM registers the
  #    service and then fails to start it with Windows error 1053. This is
  #    Operations M007, and it is still open.
  # 2. Windows child execution itself: there was no process-tree owner at all.
  #    Foundation M004 adds a Job Object backend (`plans/closure/foundation-execution-core/004-status.md`)
  #    and has qualified its tree lifecycle on hosted `windows-latest`.
  #
  # Neither fix is in the qualified candidate's bytes: M004 needs a release cut
  # first, and M007 is not implemented. This job therefore records the
  # candidate's real disposition and fails if the observation ever diverges from
  # it, so the limitation cannot silently rot. When a release containing M004 is
  # cut, run this workflow with that exact tag to replace this disposition with a
  # claim.
  windows-installed-execution:
    name: windows installed execution and service disposition
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the qualification tooling
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
      - name: Set up the pinned Rust toolchain for the client harness
        uses: "dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c"
        with:
          toolchain: "1.89.0"
      - name: Qualify the Windows installation path
        shell: pwsh
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\qualification" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\receipts" | Out-Null
          python scripts/qualify_release.py install `
            --release-tag "${{ inputs.release_tag }}" `
            --target x86_64-pc-windows-msvc `
            --installation-root "$env:RUNNER_TEMP\qualification" `
            --download-dir "$env:RUNNER_TEMP\release" `
            --receipt "$env:RUNNER_TEMP\receipts\install-windows.json"
      - name: Materialise the bounded qualification fixture
        # The repository's own rcgen-based fixture, not a runner-provided one:
        # a certificate the installed binary rejects would look like a product
        # defect rather than a fixture problem.
        shell: bash
        run: |
          set -euo pipefail
          EGGWORK_QUALIFY_ROOT="${{ runner.temp }}/qualification" \
            cargo test --locked -p eggwork-server --features qualification \
              --test installed_qualification -- --ignored --exact qualification_fixture
      - name: Qualify installed execution through the production client
        # This is the step that previously could not be claimed. For the current
        # candidate the blocker is that the runner refuses Windows outright, not
        # the child environment: `run` returned `UnsupportedPlatform` before any
        # process existed, so the receipt was `Failed / Internal / exit_code: null`
        # with nothing to blame on the environment. The runner now supplies a
        # platform-shaped environment *and* owns the process tree, so this step
        # becomes a real claim once the candidate's bytes contain Foundation M004.
        # The test also proves required filesystem isolation is refused *before*
        # the target
        # runs, which is the truthful Windows disposition.
        shell: bash
        env:
          RELEASE_QUALIFICATION_TOKEN: ${{ secrets.RELEASE_QUALIFICATION_TOKEN }}
          EGGWORK_QUALIFY_DAEMON: ${{ runner.temp }}/qualification/bin/eggworkd.exe
          EGGWORK_QUALIFY_CONFIG: ${{ runner.temp }}/qualification/state/node.json
          EGGWORK_QUALIFY_TLS_DIR: ${{ runner.temp }}/qualification/state/tls
          EGGWORK_QUALIFY_RECEIPT: ${{ runner.temp }}/receipts/execution-windows.json
          EGGWORK_QUALIFY_PLATFORM: windows
        run: |
          set -euo pipefail
          cargo test --locked -p eggwork-server --features qualification \
            --test installed_qualification -- --ignored \
            --exact installed_release_admits_execution_and_refuses_unsupported_isolation \
            --nocapture
      - name: Record the service management disposition
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\qualification"
          $exe = "$root\bin\eggworkd.exe"
          $config = "$root\state\node.json"
          $receipt = "$env:RUNNER_TEMP\receipts\windows-service.txt"
          # Service management is still `unsupported`: the daemon is not a
          # service host. What is qualified here is the *refusal*, which must
          # happen before any mutation. A release that registers a service has
          # lost that guarantee, so this is a hard failure, not a note.
          $output = & $exe service install `
            --config $config `
            --executable $exe `
            --service-config $config `
            --windows-start-type manual 2>&1 | Out-String
          $exit = $LASTEXITCODE
          "service install exit=$exit output=$output" | Out-File -FilePath $receipt -Encoding utf8
          $unsupported = $output -match 'unsupported'
          if (-not $unsupported) {
            "DISPOSITION: CHANGED, the service verb mutated state; update the support matrix" | Out-File -FilePath $receipt -Encoding utf8 -Append
            throw "Windows service install did not refuse; the fail-closed guarantee is gone"
          }
          if ($exit -eq 0) { throw "expected a non-zero refusal exit, got $exit" }
          "DISPOSITION: unsupported (refused before mutation; no service host)" | Out-File -FilePath $receipt -Encoding utf8 -Append
          # The refusal is the recorded disposition, so the step must not
          # inherit the daemon's non-zero exit as its own result.
          exit 0
      - name: Upload the Windows qualification receipts
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "installed-execution-windows-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/receipts"
          retention-days: 7
          if-no-files-found: error
