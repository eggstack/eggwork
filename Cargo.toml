[workspace]
resolver = "2"
members = [
    "crates/eggwork-core",
    "crates/eggwork-runner",
    "crates/eggwork-client",
    "crates/eggwork-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
