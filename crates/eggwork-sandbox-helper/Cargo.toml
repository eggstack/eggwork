[package]
name = "eggwork-sandbox-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "eggwork-sandbox-helper"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json.workspace = true

# The helper's Linux-only sandbox machinery (`mod linux`) is the sole user of
# these crates. Both are Unix/Linux-only and must not enter the build graph on
# other hosts; the non-Linux entry point uses neither.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
eggwork-runner = { path = "../eggwork-runner" }
eggwork-core = { path = "../eggwork-core" }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

[lints]
workspace = true
