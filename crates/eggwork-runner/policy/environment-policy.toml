# Single source for the runner and standalone helper environment policy.
# The generator writes both crate-local copies; a parity test detects drift.
# Edit this file, not either generated copy.

schema_version = 1

# Match environment keys case-insensitively, as exact names or prefixes:
#
#   upper = key.to_ascii_uppercase()
#   matches(entry) := upper == entry || upper.starts_with(entry)
#
# Prefix entries cover whole key families; `PATH` also denies names beginning
# with that prefix. Preserve this rule when changing either enforcement copy.
[match]
rule = "ascii-uppercase-exact-or-prefix"

# Caller-controlled environment keys that are unsafe for node execution.
# The runner drops them; the helper refuses if any remain after normalization.
# Changes to this set are security policy changes and require review.
[denied]
keys = [
    "LD_",
    "DYLD_",
    "PATH",
    "IFS",
    "SHELLOPTS",
    "CDPATH",
    "BASH_ENV",
    "ENV",
    "PYTHONPATH",
    "PYTHONHOME",
    "NODE_OPTIONS",
    "RUBYOPT",
    "PERL5OPT",
    "GIT_ASKPASS",
    "SSH_ASKPASS",
    "GIT_CONFIG",
    "GIT_CONFIG_",
    "AWS_",
    "AZURE_",
    "GOOGLE_",
    "SSH_AUTH_SOCK",
]

# Node-owned child environment entries. The Unix baseline is enforced by the
# helper; Windows has a runner-local baseline built from system paths.
[baseline.unix]
PATH = "/usr/bin:/bin"
LANG = "C.UTF-8"
LC_ALL = "C.UTF-8"
CI = "1"
NO_COLOR = "1"
TERM = "dumb"
GIT_TERMINAL_PROMPT = "0"
PAGER = "cat"

[baseline.windows_common]
keys = [
    "CI",
    "NO_COLOR",
    "TERM",
    "GIT_TERMINAL_PROMPT",
    "PAGER",
]

# Unix baseline keys whose values are owned by the node. Windows adds its
# platform-specific keys in the runner.
[reserved]
keys = [
    "PATH",
    "LANG",
    "LC_ALL",
    "CI",
    "NO_COLOR",
    "TERM",
    "GIT_TERMINAL_PROMPT",
    "PAGER",
]

# Linux/Unix PATH is pinned because Landlock does not restrict executable
# lookup. Windows uses its own system path and is outside this contract.
[path_contract]
value = "/usr/bin:/bin"
scope = "linux-unix"
