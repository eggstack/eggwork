[package]
name = "eggwork-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eggwork-core = { path = "../eggwork-core" }
eggwork-runner = { path = "../eggwork-runner" }
eggserve-core.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
bytes.workspace = true
futures-util.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
hex.workspace = true
tokio-util.workspace = true
rusqlite.workspace = true
rustix = { version = "1.1.5", features = ["fs", "process"] }
rustls = "0.23"
rustls-pemfile = "2"
fs2 = "0.4"

[[bin]]
name = "eggworkd"
path = "src/bin/eggworkd.rs"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
rustls = "0.23"
base64.workspace = true
eggwork-client = { path = "../eggwork-client", features = ["eggress-route"] }
eggfetch-core.workspace = true
eggress-testkit = "1.0.8"

[lints]
workspace = true
