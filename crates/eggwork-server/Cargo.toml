[package]
name = "eggwork-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eggwork-core = { path = "../eggwork-core" }
eggwork-runner = { path = "../eggwork-runner" }
eggserve-core.workspace = true
eggfetch-core.workspace = true
url.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
bytes.workspace = true
futures-util.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
hex.workspace = true
tokio-util.workspace = true
rusqlite.workspace = true
rustix = { version = "1.1.5", features = ["fs", "process"] }
rustls = "0.23"
rustls-pemfile = "2"
fs2 = "0.4"
eggup-core = "0.1.1"
eggup-service = "0.1.1"
gregg-protocol = "1.0.15"

# The Windows SCM *host*. This crate hosts the service process; it does not
# register or manage it — Eggup owns that, through `eggup-service`. The
# dependency is target-scoped because the dispatcher is Windows-only, and it
# is pinned exactly so the reviewed surface is explicit.
[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"

# The installed-release qualification harness (Operations M004) is opt-in: it
# drives an installed `eggworkd` through the production client path and must not
# be compiled into an ordinary build of the shipped daemon.
[features]
default = []
qualification = []

[[bin]]
name = "eggworkd"
path = "src/bin/eggworkd.rs"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
rustls = "0.23"
base64.workspace = true
eggwork-client = { path = "../eggwork-client", features = ["eggress-route"] }
eggfetch-core.workspace = true
eggress-testkit = "1.0.8"
toml = "0.8"

[lints]
workspace = true
