schema_version = 1

# Eggpack producer build/qualification policy for eggwork (Operations M003).
#
# Targets are canonically ordered by triple. Every required target is built
# with `BuildStrategy::NativeCargo` on a host whose OS/architecture matches the
# target, and qualified with `Qualification::Native` on that same host.
#
# No compatibility floor is declared. Eggwork documents no glibc/macOS
# deployment floor today, so introducing a floor (or CargoZigbuild) purely for
# cross-repo consistency would be an unsupported policy change.
#
# The Rust channel is pinned to the exact patch recorded in
# `rust-toolchain.toml`.

[[targets]]
target = "aarch64-apple-darwin"
strategy = "native_cargo"
host_os = "macos"
host_arch = "aarch64"
floor = { kind = "none" }
qualification = "native"
support = "required"

[targets.toolchain]
rust = "1.89.0"

[[targets]]
target = "aarch64-unknown-linux-gnu"
strategy = "native_cargo"
host_os = "linux"
host_arch = "aarch64"
floor = { kind = "none" }
qualification = "native"
support = "required"

[targets.toolchain]
rust = "1.89.0"

[[targets]]
target = "x86_64-apple-darwin"
strategy = "native_cargo"
host_os = "macos"
host_arch = "x86_64"
floor = { kind = "none" }
qualification = "native"
support = "required"

[targets.toolchain]
rust = "1.89.0"

[[targets]]
target = "x86_64-pc-windows-msvc"
strategy = "native_cargo"
host_os = "windows"
host_arch = "x86_64"
floor = { kind = "none" }
qualification = "native"
support = "required"

[targets.toolchain]
rust = "1.89.0"

[[targets]]
target = "x86_64-unknown-linux-gnu"
strategy = "native_cargo"
host_os = "linux"
host_arch = "x86_64"
floor = { kind = "none" }
qualification = "native"
support = "required"

[targets.toolchain]
rust = "1.89.0"
